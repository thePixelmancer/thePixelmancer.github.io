<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Angelo - Career journey map" />
    <title>Journey — Angelo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="dist/styles.css" />

    <style>
      /* Paper border wraps the canvas */
      .map-paper {
        border: 20px solid;
        border-image-source: url("images/borders/border-paper.png");
        border-image-slice: 8 8 8 8 fill;
        border-image-width: 20px;
        border-image-outset: 0px;
        border-image-repeat: repeat;
        box-shadow:
          6px 6px 0 rgba(0, 0, 0, 0.6),
          0 0 60px rgba(0, 0, 0, 0.4);
        position: relative;
        overflow: hidden;
        display: block;
      }

      .map-mobile-hint {
        margin-top: 0.75rem;
        text-align: center;
        font-family: "Silkscreen", cursive;
        font-size: 0.5rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgb(156, 163, 175);
      }

      #journey-canvas-wrap {
        display: block;
        position: relative;
      }
      #journey-canvas-wrap canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated;
      }

      /* HTML tooltip overlay */
      #journey-tooltip {
        position: absolute;
        z-index: 30;
        width: 240px;
        pointer-events: none;
        transition:
          opacity 100ms ease,
          transform 100ms ease;
      }
      #journey-tooltip.hidden {
        opacity: 0;
        transform: translateY(3px);
      }

      #journey-region-tooltip {
        position: absolute;
        z-index: 31;
        width: 280px;
        pointer-events: none;
        transition:
          opacity 100ms ease,
          transform 100ms ease;
      }
      #journey-region-tooltip.hidden {
        opacity: 0;
        transform: translateY(3px);
      }

      @keyframes mapReveal {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .map-reveal {
        animation: mapReveal 280ms ease-out forwards;
      }

      @media (max-width: 768px) {
        #journey-tooltip {
          width: min(240px, calc(100vw - 40px));
        }

        #journey-region-tooltip {
          width: min(280px, calc(100vw - 40px));
        }

        .map-mobile-hint {
          font-size: 0.45rem;
          letter-spacing: 0.14em;
        }
      }
    </style>
  </head>

  <body class="bg-dark-900 flex h-[100dvh] min-h-0 flex-col overflow-hidden" style="--page-accent: rgba(251, 146, 60, 0.1)">
    <div
      class="page-header"
      style="
        --header-accent-border: rgba(251, 146, 60, 0.4);
        --header-accent-text: rgb(253, 186, 116);
        --header-accent-glow: rgba(251, 146, 60, 0.5);
        --header-accent-line: rgba(251, 146, 60, 0.3);
      ">
      <a href="index.html" class="page-back-btn" aria-label="Back to menu">&lt;</a>
      <div class="flex-1 flex flex-col items-center gap-1">
        <h1 class="page-title">WORLD MAP</h1>
        <div class="flex items-center gap-3">
          <div class="page-title-line"></div>
          <p class="page-subtitle">Journey so far</p>
          <div class="page-title-line"></div>
        </div>
      </div>
      <div class="flex-shrink-0 w-16" aria-hidden="true"></div>
    </div>

    <!-- Container sizing controlled by Tailwind; canvas only fits this box -->
    <main class="relative z-10 flex flex-1 min-h-0 items-stretch justify-center px-5 pb-5 pt-2 md:items-center md:px-8 md:pb-6 md:pt-2">
      <div class="map-reveal map-shell flex h-full min-h-0 w-full flex-col md:h-auto md:w-[96vw] md:max-w-[1500px]">
        <!-- MAP -->
        <div class="map-paper flex-1 min-h-0 md:flex-none md:aspect-[4/3]">
          <div id="journey-canvas-wrap" class="h-full w-full min-h-0">
            <!-- p5 canvas injected here by journey-map.js -->
          </div>

          <!-- HTML tooltip (positioned absolute inside map-paper) -->
          <div id="journey-tooltip" class="hidden">
            <div class="bg-dark-800 border-3 border-dark-700 flex flex-col overflow-hidden relative" style="box-shadow: var(--shadow-overlay)">
              <!-- Color accent line — background filled by JS from node color -->
              <div id="jt-accent-bar" class="absolute top-0 inset-x-0 h-px pointer-events-none shrink-0"></div>
              <!-- Body -->
              <div class="px-4 pt-5 pb-4 flex flex-col items-center gap-2 text-center">
                <span id="jt-company" class="font-title text-xs leading-tight"></span>
                <p id="jt-title" class="font-title text-sm text-gray-100 leading-snug"></p>
                <p id="jt-desc" class="text-xs text-gray-400 leading-relaxed hidden"></p>
                <p id="jt-period" class="font-title text-xs text-gray-600 tracking-widest hidden mt-auto"></p>
              </div>
            </div>
          </div>

          <div id="journey-region-tooltip" class="hidden">
            <div id="jr-content"></div>
          </div>
        </div>
        <p class="map-mobile-hint hidden md:block">Drag to pan. Wheel or pinch to zoom. Tap markers.</p>
      </div>
    </main>

    <div class="ambient-glow"></div>

    <!-- p5.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>

    <!-- Voronoi / Delaunay helper -->
    <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>

    <script src="./js/parallax.js"></script>
    <script src="./js/particles.js"></script>

    <!-- Drawing primitives library -->
    <script src="./js/journey-map.js"></script>

    <!-- The actual map -->
    <script src="./js/journey.js"></script>
  </body>
</html>
