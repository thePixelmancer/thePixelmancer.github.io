<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Angelo - Battles won and lessons earned" />
    <title>Journal — Angelo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="dist/styles.css" />
  </head>

  <body class="bg-dark-900" style="--page-accent: rgba(192,132,252,0.15)">

    <div class="page-header page-header--purple">
      <a href="index.html" class="page-back-btn">← MENU</a>
      <div class="flex-1 flex flex-col items-center gap-1">
        <h1 class="page-title">Journal</h1>
        <div class="flex items-center gap-3">
          <div class="page-title-line"></div>
          <p class="page-subtitle">Battles won and lessons earned</p>
          <div class="page-title-line"></div>
        </div>
      </div>
      <div class="page-back-spacer" aria-hidden="true"></div>
    </div>

    <main class="page-main">
      <div class="py-6 flex flex-col gap-6">

        <!-- Filter strip -->
        <div class="flex flex-wrap gap-2">
          <button class="journal-filter active" data-filter="all">All</button>
          <button class="journal-filter" data-filter="lead">Lead</button>
          <button class="journal-filter" data-filter="dev">Dev</button>
          <button class="journal-filter" data-filter="artist">Artist</button>
        </div>

        <div id="quests-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
      </div>
    </main>

    <div class="ambient-glow"></div>

    <!-- modal.js must load before quest-generator.js -->
    <script src="./js/parallax.js"></script>
    <script src="./js/particles.js"></script>
    <script src="./js/modal.js"></script>
    <script src="./js/quest-generator.js"></script>
  </body>
</html>
