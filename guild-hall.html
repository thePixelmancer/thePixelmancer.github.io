<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Guild Hall - Showcasing guilds and alliances" />
    <title>Guild Hall — Angelo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="dist/styles.css" />
  </head>

  <body class="bg-dark-900" style="--page-accent: rgba(156, 163, 175, 0.12)">
    <div
      class="page-header"
      style="
        --header-accent-border: rgba(156, 163, 175, 0.3);
        --header-accent-text: rgb(209, 213, 219);
        --header-accent-glow: rgba(156, 163, 175, 0.4);
        --header-accent-line: rgba(156, 163, 175, 0.3);
      ">
      <a href="index.html" class="page-back-btn">← MENU</a>
      <div class="flex-1 flex flex-col items-center gap-1">
        <h1 class="page-title">Guild Hall</h1>
        <div class="flex items-center gap-3">
          <div class="page-title-line"></div>
          <p class="page-subtitle">Allies & connections</p>
          <div class="page-title-line"></div>
        </div>
      </div>
      <div class="flex-shrink-0 w-16" aria-hidden="true"></div>
    </div>

    <main class="page-main max-w-5xl flex flex-col gap-8">
      <a id="guild-independent" href="#" tabindex="-1" aria-hidden="true" class="hidden guild-card guild-card--green border-big">
        <div class="guild-card-line"></div>
        <div class="guild-card-icon">
          <svg class="w-12 h-12 text-green-300" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"
              clip-rule="evenodd" />
          </svg>
        </div>
        <h3 class="guild-card-title">Independent</h3>
        <span class="guild-card-role">Freelance</span>
        <span class="text-xs text-gray-600 tracking-widest mt-auto">2016 - Present</span>
      </a>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 max-w-2xl mx-auto w-full">
        <a
          id="guild-tsunami-studios"
          href="https://www.tsunamistudios.com"
          target="_blank"
          rel="noopener noreferrer"
          class="guild-card guild-card--blue border-water">
          <div class="guild-card-line"></div>
          <div class="guild-card-icon">
            <svg class="w-12 h-12 text-blue-300" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
            </svg>
          </div>
          <h3 class="guild-card-title">Tsunami Studios</h3>
          <span class="guild-card-role">Developer & Artist</span>
          <span class="text-xs text-gray-600 tracking-widest mt-auto">2022 - 2024</span>
        </a>

        <a
          id="guild-simply-brilliant"
          href="https://www.simplybrilliant.co"
          target="_blank"
          rel="noopener noreferrer"
          class="guild-card guild-card--yellow border-simply">
          <div class="guild-card-line"></div>
          <div class="guild-card-icon">
            <svg class="w-12 h-12 text-yellow-300" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                clip-rule="evenodd" />
            </svg>
          </div>
          <h3 class="guild-card-title">Simply Brilliant</h3>
          <span class="guild-card-role">Collaborator</span>
          <span class="text-xs text-gray-600 tracking-widest mt-auto">2023</span>
        </a>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <a
          id="guild-shapescape"
          href="https://www.shapescape.com"
          target="_blank"
          rel="noopener noreferrer"
          class="guild-card guild-card--purple border-shapescape">
          <div class="guild-card-line"></div>
          <div class="guild-card-icon">
            <svg class="w-12 h-12 text-purple-300" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0zM6 18a1 1 0 001-1v-2.065a8.935 8.935 0 00-2-.712V17a1 1 0 001 1z" />
            </svg>
          </div>
          <h3 class="guild-card-title">Shapescape</h3>
          <span class="guild-card-role">Branch Lead</span>
          <span class="text-xs text-gray-600 tracking-widest mt-auto">2024</span>
        </a>

        <a id="guild-xp-games" href="https://www.xpgames.co" target="_blank" rel="noopener noreferrer" class="guild-card guild-card--green border-xp">
          <div class="guild-card-line"></div>
          <div class="guild-card-icon">
            <svg class="w-12 h-12 text-green-300" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"
                clip-rule="evenodd" />
            </svg>
          </div>
          <h3 class="guild-card-title">XP Games</h3>
          <span class="guild-card-role">Developer</span>
          <span class="text-xs text-gray-600 tracking-widest mt-auto">2023</span>
        </a>

        <a
          id="guild-nitric-studios"
          href="https://www.nitricstudios.com"
          target="_blank"
          rel="noopener noreferrer"
          class="guild-card guild-card--orange border-nitric">
          <div class="guild-card-line"></div>
          <div class="guild-card-icon">
            <svg class="w-12 h-12 text-orange-300" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z"
                clip-rule="evenodd" />
            </svg>
          </div>
          <h3 class="guild-card-title">Nitric Studios</h3>
          <span class="guild-card-role">Developer</span>
          <span class="text-xs text-gray-600 tracking-widest mt-auto">2024</span>
        </a>
      </div>
    </main>

    <div class="ambient-glow"></div>

    <script src="./js/particles.js"></script>
  </body>
</html>
