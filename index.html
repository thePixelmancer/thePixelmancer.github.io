<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Angelo - Minecraft Bedrock Developer specializing in boss behaviors, custom animations, and technical systems" />
    <title>Angelo | Pixelmancer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="dist/styles.css" />
  </head>

  <body class="bg-dark-900 min-h-screen flex flex-col items-center justify-center p-6 overflow-hidden select-none"
        style="--page-accent: rgba(245,158,11,0.12)">

    <!-- ── Content (above parallax layers z-index 1-3) ────────────────────── -->
    <div class="relative z-10 flex flex-col items-center w-full gap-8">

      <!-- ── Site title ─────────────────────────────────────────────────────── -->
      <header class="text-center space-y-3">
        <p class="text-[8px] tracking-[0.3em] text-gray-500 uppercase">Minecraft Bedrock Developer</p>
        <h1 class="font-title text-5xl md:text-6xl text-amber-300" style="text-shadow: 0 0 20px rgba(245,158,11,0.4);">ANGELO</h1>
        <div class="flex items-center justify-center gap-4">
          <div class="h-px w-10 bg-gradient-to-r from-transparent to-amber-500/50"></div>
          <p class="text-[9px] text-fuchsia-400">Pixelmancer</p>
          <div class="h-px w-10 bg-gradient-to-l from-transparent to-amber-500/50"></div>
        </div>
      </header>

      <!-- ── Main layout ──────────────────────────────────────────────────────── -->
      <main class="grid grid-cols-1 md:grid-cols-3 gap-8 items-center max-w-5xl w-full">

        <!-- Left column: nav buttons -->
        <nav class="flex flex-col gap-4 order-2 md:order-1" aria-label="Character pages">
          <a href="bio.html" class="flex items-center bg-dark-900/60 border-2 border-amber-600 p-3 transition-all duration-100 no-underline hover:border-amber-400 hover:translate-x-1.5">
            <span class="w-8 h-8 flex-shrink-0 flex items-center justify-center border-r-2 border-amber-600 mr-4 text-xs bg-amber-600/20 text-amber-500">📜</span>
            <span class="text-xs text-amber-400 transition-colors duration-100">BIO</span>
          </a>
          <a href="skills.html" class="flex items-center bg-dark-900/60 border-2 border-blue-600 p-3 transition-all duration-100 no-underline hover:border-blue-400 hover:translate-x-1.5">
            <span class="w-8 h-8 flex-shrink-0 flex items-center justify-center border-r-2 border-blue-600 mr-4 text-xs bg-blue-600/20 text-blue-500">📊</span>
            <span class="text-xs text-blue-400 transition-colors duration-100">SKILLS</span>
          </a>
          <a href="journey.html" class="flex items-center bg-dark-900/60 border-2 border-green-600 p-3 transition-all duration-100 no-underline hover:border-green-400 hover:translate-x-1.5">
            <span class="w-8 h-8 flex-shrink-0 flex items-center justify-center border-r-2 border-green-600 mr-4 text-xs bg-green-600/20 text-green-500">🗺️</span>
            <span class="text-xs text-green-400 transition-colors duration-100">WORLD MAP</span>
          </a>
        </nav>

        <!-- Center: character panel -->
        <div class="flex flex-col items-center gap-3 order-1 md:order-2">

          <!-- Avatar frame -->
          <div class="relative p-1 border-4 border-amber-400" style="box-shadow: 0 0 30px rgba(168, 85, 247, 0.35), 0 0 60px rgba(255, 204, 51, 0.1);">
            <img src="images/avatar.png" alt="Angelo's pixel avatar" class="w-40 h-40 md:w-52 md:h-52 object-cover" style="image-rendering: pixelated;" />
          </div>

          <!-- XP bar -->
          <div class="w-full max-w-xs"
               role="progressbar" aria-label="Experience points" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            <div class="h-4 bg-dark-700 overflow-hidden border border-dark-700">
              <div id="xpBar" class="h-full bg-gradient-to-r from-green-500 to-emerald-400 transition-all duration-1000"></div>
            </div>
            <p id="xpText" class="text-center text-xs text-gray-500 mt-1">XP: 0 / 100</p>
          </div>

          <!-- Availability -->
          <div class="flex items-center gap-2">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full bg-green-400 opacity-75"></span>
              <span class="relative inline-flex h-2 w-2 bg-green-500"></span>
            </span>
            <p class="text-[8px] text-green-500 tracking-widest">AVAILABLE FOR WORK</p>
          </div>

        </div>

        <!-- Right column: nav buttons -->
        <nav class="flex flex-col gap-4 order-3" aria-label="Portfolio sections">
          <a href="forge.html" class="flex items-center justify-between bg-dark-900/60 border-2 border-orange-600 p-3 transition-all duration-100 no-underline hover:border-orange-400 hover:-translate-x-1.5">
            <span class="text-xs text-orange-400 transition-colors duration-100">FORGE</span>
            <span class="w-8 h-8 flex-shrink-0 flex items-center justify-center border-l-2 border-orange-600 ml-4 text-xs bg-orange-600/20 text-orange-500">⚒️</span>
          </a>
          <a href="journal.html" class="flex items-center justify-between bg-dark-900/60 border-2 border-purple-600 p-3 transition-all duration-100 no-underline hover:border-purple-400 hover:-translate-x-1.5">
            <span class="text-xs text-purple-400 transition-colors duration-100">JOURNAL</span>
            <span class="w-8 h-8 flex-shrink-0 flex items-center justify-center border-l-2 border-purple-600 ml-4 text-xs bg-purple-600/20 text-purple-500">📖</span>
          </a>
          <a href="guild-hall.html" class="flex items-center justify-between bg-dark-900/60 border-2 border-gray-600 p-3 transition-all duration-100 no-underline hover:border-gray-400 hover:-translate-x-1.5">
            <span class="text-xs text-gray-300 transition-colors duration-100">GUILD HALL</span>
            <span class="w-8 h-8 flex-shrink-0 flex items-center justify-center border-l-2 border-gray-600 ml-4 text-xs bg-gray-600/20 text-gray-400">🛡️</span>
          </a>
        </nav>

      </main>

      <!-- ── Contact footer strip ────────────────────────────────────────────── -->
      <footer class="mt-14 flex flex-wrap items-center justify-center gap-3" aria-label="Contact">
        <a href="mailto:hello@pixelmancer.dev" class="flex items-center gap-1.5 text-xs text-gray-500 hover:text-gray-200 transition-colors no-underline tracking-wide">
          <svg viewBox="0 0 16 16" class="w-3 h-3 fill-current" aria-hidden="true">
            <path d="M0 4v8h16V4H0zm14 1L8 9 2 5h12zm-12 6V6.5l6 3.5 6-3.5V11H2z"/>
          </svg>
          hello@pixelmancer.dev
        </a>
        <span class="text-dark-700" aria-hidden="true">·</span>
        <a href="https://github.com/pixelmancer" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 text-xs text-gray-500 hover:text-gray-200 transition-colors no-underline tracking-wide">
          <svg viewBox="0 0 16 16" class="w-3 h-3 fill-current" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          @pixelmancer
        </a>
      </footer>

    </div><!-- end z-10 content wrapper -->

    <!-- Ambient glows -->
    <div class="fixed bottom-0 w-full h-64 bg-gradient-to-t from-orange-500/5 to-transparent pointer-events-none"></div>
    <div class="fixed bottom-10 left-1/4 w-1 h-20 bg-orange-500/20 blur-xl pointer-events-none"></div>
    <div class="fixed bottom-10 right-1/4 w-1 h-20 bg-orange-500/20 blur-xl pointer-events-none"></div>

    <script src="./js/parallax.js"></script>
    <script src="./js/xp-system.js"></script>
    <script src="./js/particles.js"></script>
  </body>
</html>
