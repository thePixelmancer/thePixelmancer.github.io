<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Angelo - Skills and disciplines mastered" />
    <title>Skills — Angelo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="dist/styles.css" />
  </head>

  <body class="bg-dark-900" style="--page-accent: rgba(232,121,249,0.15)">

    <div class="page-header" style="--header-accent-border: rgba(232, 121, 249, 0.4); --header-accent-text: rgb(240, 171, 252); --header-accent-glow: rgba(232, 121, 249, 0.5); --header-accent-line: rgba(232, 121, 249, 0.3);">
      <a href="index.html" class="page-back-btn">MENU</a>
      <div class="flex-1 flex flex-col items-center gap-1">
        <h1 class="page-title">Skills</h1>
        <div class="flex items-center gap-3">
          <div class="page-title-line"></div>
          <p class="page-subtitle">Disciplines mastered</p>
          <div class="page-title-line"></div>
        </div>
      </div>
      <div class="flex-shrink-0 w-16" aria-hidden="true"></div>

    <main class="page-main flex items-center min-h-[calc(100vh-60px)]">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl mx-auto">

          <!-- Development panel -->
          <div class="card-nohover border-small flex flex-col gap-0 overflow-hidden">

            <div id="dev-skill-list" class="flex flex-col gap-3 p-5"></div>

          <div class="card-nohover border-small flex flex-col gap-0 overflow-hidden">

            </div>
            <div id="art-skill-list" class="flex flex-col gap-3 p-5"></div>
          </div>

      </div>
    </main>

    <div class="ambient-glow"></div>

    <script src="./js/parallax.js"></script>
    <script src="./js/particles.js"></script>
    <script src="./js/skills-generator.js"></script>

</html>
