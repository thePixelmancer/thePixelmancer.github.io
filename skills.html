<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Angelo - Skills and disciplines mastered" />
    <title>Skills — Angelo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="dist/styles.css" />
  </head>

  <body class="bg-dark-900">

    <div class="page-header page-header--blue">
      <a href="index.html" class="page-back-btn">← MENU</a>
      <h1 class="page-title">Skills</h1>
      <p class="page-subtitle">Disciplines mastered</p>
    </div>

    <main class="page-main">
      <div class="max-w-2xl mx-auto flex flex-col gap-4">

        <article class="card flex flex-col gap-3 border-small p-6">
          <div class="flex items-center gap-3">
            <span class="circle bg-blue-400" aria-hidden="true"></span>
            <h3 class="font-title text-base text-blue-300">Development</h3>
          </div>
          <p class="text-xs text-gray-500 leading-relaxed">Technical Skills</p>
          <div id="dev-skill-tags" class="flex flex-wrap gap-2">
            <!-- populated by skills-generator.js -->
          </div>
        </article>

        <article class="card flex flex-col gap-3 border-small p-6">
          <div class="flex items-center gap-3">
            <span class="circle bg-fuchsia-400" aria-hidden="true"></span>
            <h3 class="font-title text-base text-fuchsia-300">Art &amp; Design</h3>
          </div>
          <p class="text-xs text-gray-500 leading-relaxed">Visuals and Arts</p>
          <div id="art-skill-tags" class="flex flex-wrap gap-2">
            <!-- populated by skills-generator.js -->
          </div>
        </article>

      </div>
    </main>

    <!-- Ambient glow -->
    <div class="fixed inset-0 pointer-events-none -z-10"
         style="background: radial-gradient(ellipse at 50% 110%, rgba(96,165,250,0.05) 0%, transparent 60%)"></div>

    <script src="./js/parallax.js"></script>
    <script src="./js/skills-generator.js"></script>
